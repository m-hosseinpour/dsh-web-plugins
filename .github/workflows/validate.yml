name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check manifests, patch rows and module ids
        run: node scripts/validate.mjs

      - name: Check that every JavaScript file parses
        run: find plugins -name '*.js' -print0 | xargs -0 -n1 node --check
